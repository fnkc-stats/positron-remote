# Check Setup on real computers: with tools hidden, every problem is found and said clearly; then the suggested
# commands run for real (apt, Homebrew, systemctl, an elevated PowerShell window, ssh against a local sshd) and the
# checks run again to see that the commands fixed it (ctl/test/check-setup.acceptance.ts). The runners are thrown away,
# so the test may install software, add a user and stop services (FNKC_SYSTEM_TESTS=1).
name: Checks · Check Setup
# Called by extension.yml on every change of ctl/ (and of this file), whose release waits for it, so a setup check or
# suggested fix that fails on one of the three platforms never reaches a published .vsix; by hand: workflow_dispatch.
# No triggers of its own, so a change does not start the matrix twice, and no concurrency group: extension.yml's
# applies (a group here would let a newer main run cancel an older run's pending check and fail its release).
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FNKC_SYSTEM_TESTS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - run: npm ci --prefix ctl
      # sshd for a local stand-in of Gitea; gnupg for the passphrase-window fix; apt lists for the package check
      - name: Tools the Linux test uses
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server gnupg
      # The Linux test runs fnkc-ctl doctor --json as an account outside the docker group
      - run: npm --prefix ctl run build:cli
      - run: npm --prefix ctl run test:check-setup
