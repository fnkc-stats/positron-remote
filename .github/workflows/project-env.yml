# Reusable workflow: a project's environment image (the project's Dockerfile FROM r-env:<tag>).
# Called from a project repository, see project-template/project-env.yml.
# Image: ghcr.io/<owner>/<repository>-env:<date>-<short commit>.
name: project env image

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      platforms:
        type: string
        default: linux/amd64
    outputs:
      image:
        description: "The built image with its tag"
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tag
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/$owner/$repo-env:$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.ref }}

      - name: Summary
        run: |
          echo "In container.env: \`ENV_IMAGE=${{ steps.meta.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
