# Builds the R environment image of one series natively for each architecture, checks it, and on main publishes it
# with a unique tag (<series>-env-<commit>-<run>-<attempt>) and a multi-architecture index: the image projects pin in
# container.json. Then, on main, positron.yml adds the team's Positron server on top: the image containers run.
# With `existing` (env-image.yml: the inputs did not change), the published environment is pulled instead of built,
# the same checks run on it, and nothing new is published but the server layer, if it is missing. Its SSH tests use
# the published runnable image when that was made from the same recipe, instead of building the server layer again.
# Called by env-image.yml once per R series. The checks run the images with no network, as the analyst user.
name: image
on:
  workflow_call:
    inputs:
      name:
        description: 'Repository under ghcr.io/<owner>/, e.g. r-env'
        required: true
        type: string
      variant:
        description: 'Several images in one repository (r-env: the R series): tags and caches start with it'
        required: true
        type: string
      build-args:
        description: 'Build arguments of the environment, one NAME=value per line'
        required: true
        type: string
      positron-args:
        description: "The team's Positron server (env/positron.args), one NAME=value per line"
        required: true
        type: string
      existing:
        description: 'A published environment with the same inputs, pinned by digest: checked, not built (empty: build)'
        required: false
        type: string
        default: ''
      r-checks:
        description: 'Run the R verification, report and checks (false: an unchanged environment whose checks did not change)'
        required: false
        type: boolean
        default: true
    outputs:
      environment:
        description: 'The environment image, pinned by digest (main only)'
        value: ${{ jobs.publish-manifest.outputs.image || jobs.build.outputs.environment }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      environment: ${{ inputs.existing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The job can push packages: no token in .git/config for the build tools
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Pull the published environment (its inputs did not change)
        if: inputs.existing != ''
        env:
          EXISTING: ${{ inputs.existing }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull --quiet --platform "linux/$ARCH" "$EXISTING"
          docker tag "$EXISTING" r-env:verified
      # The SSH tests then run on the image projects run, instead of downloading and building the server layer again.
      # Only for the same recipe (positron.recipe, env/positron-recipe.sh): a changed env/positron.Dockerfile or
      # env/positron.args, a missing tag or any lookup error builds the layer from source, as for a new environment.
      - name: Pull the published server layer (same environment and recipe)
        id: runnable
        if: inputs.existing != ''
        env:
          EXISTING: ${{ inputs.existing }}
          POSITRON_ARGS: ${{ inputs.positron-args }}
          ARCH: ${{ matrix.arch }}
        run: |
          version="$(sed -n 's/^POSITRON_VERSION=//p' <<< "$POSITRON_ARGS")"
          recipe="$(env/positron-recipe.sh <<< "$POSITRON_ARGS")"
          ref="${EXISTING%@*}:positron-$version-${EXISTING##*sha256:}"
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest)"; then
            echo "SSH tests on a fresh server layer: \`$ref\` is not published (or the lookup failed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          have="$(docker buildx imagetools inspect "${EXISTING%@*}@$digest" --format '{{json .Image}}' 2>/dev/null \
            | jq -r --arg p "linux/$ARCH" 'if has("config") then .config.Labels else .[$p].config.Labels end | ."positron.recipe" // ""' || true)"
          if [ "$have" != "$recipe" ]; then
            echo "SSH tests on a fresh server layer: \`$ref\` was made from recipe ${have:-unknown}, not ${recipe:0:12}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker pull --quiet --platform "linux/$ARCH" "${EXISTING%@*}@$digest"
          docker tag "${EXISTING%@*}@$digest" r-env:positron-published
          echo "image=r-env:positron-published" >> "$GITHUB_OUTPUT"
          echo "SSH tests on the published \`${EXISTING%@*}@$digest\` (recipe ${recipe:0:12})" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the environment
        if: inputs.existing == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: env
          file: env/Dockerfile
          build-args: |
            ${{ inputs.build-args }}
            SOURCE_REVISION=${{ github.sha }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: r-env:verified
          cache-from: type=gha,scope=${{ inputs.name }}-${{ inputs.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}-${{ inputs.variant }}-${{ matrix.arch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # The same script runs locally (./ci-local.sh image <series>): labels, verify.R and report, the Positron server on
      # top, the R checks, real SSH (test:ssh)
      - name: Check the environment
        env:
          POSITRON_ARGS: ${{ inputs.positron-args }}
          R_CHECKS: ${{ inputs.r-checks }}
          POSITRON_IMAGE: ${{ steps.runnable.outputs.image }}
        run: |
          printf '%s\n' "$POSITRON_ARGS" > "$RUNNER_TEMP/positron.args"
          opts=(--positron-args "$RUNNER_TEMP/positron.args" --out "$RUNNER_TEMP/r-checks")
          [ "$R_CHECKS" = true ] || opts+=(--no-r-checks)
          [ -z "$POSITRON_IMAGE" ] || opts+=(--positron-image "$POSITRON_IMAGE")
          env/check-image.sh r-env:verified "${opts[@]}"
      - name: Keep the check results
        if: always() && inputs.r-checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r-checks-${{ inputs.name }}-${{ inputs.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/r-checks
          if-no-files-found: ignore
      # Known vulnerabilities of a new environment, for review (report only: published digests are immutable, a fix
      # is a new environment through env/lock.sh or a new base digest)
      - name: Vulnerability report of the new environment
        if: inputs.existing == ''
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress r-env:verified | tee "$RUNNER_TEMP/trivy.txt"
          { echo '### Vulnerabilities (HIGH, CRITICAL)'; echo '```'; grep -E '^Total:' "$RUNNER_TEMP/trivy.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Login for trusted main publication only
        if: inputs.existing == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested environment (unique tag)
        if: inputs.existing == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ inputs.name }}
          VARIANT: ${{ inputs.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$NAME"
          tag="${VARIANT}-env-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag r-env:verified "$image:$tag"
          docker push "$image:$tag"
  publish-manifest:
    needs: build
    if: inputs.existing == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.index.outputs.image }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture index after every architecture passed
        id: index
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ inputs.name }}
          VARIANT: ${{ inputs.variant }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$NAME"
          tag="${VARIANT}-env-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create -t "$image:$tag" "$image:$tag-amd64" "$image:$tag-arm64"
          digest="$(docker buildx imagetools inspect "$image:$tag" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$digest"
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "Pin in container.json (R ${VARIANT}): \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
  positron:
    needs: [build, publish-manifest]
    # After a new environment is published, or for the reused one (the layer is skipped if it is published already)
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/positron.yml
    with:
      base: ${{ inputs.existing || needs.publish-manifest.outputs.image }}
      positron-args: ${{ inputs.positron-args }}
