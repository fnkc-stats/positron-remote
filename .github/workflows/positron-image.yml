# Собирает слой Positron поверх образа окружения: <ENV_IMAGE>-positron-<версия>, и пушит в ghcr.io.
# Тот же build-image.sh, что и локально. Если образ уже есть в реестре, сборка пропускается.
#
# Обычно не обязателен: run-positron.sh сам соберёт недостающий образ на хосте. Полезен, чтобы
# заранее подготовить образ под новую версию Positron (раз в неделю для DEFAULT_ENV_IMAGE).
name: positron image

on:
  workflow_dispatch:
    inputs:
      env_image:
        description: "Образ окружения с тегом, например ghcr.io/<owner>/r-env:2026.11.16-abc1234 (пусто = переменная DEFAULT_ENV_IMAGE)"
        required: false
      version:
        description: "Версия Positron, например 2026.11.1-4 (пусто = последний релиз)"
        required: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          # Repository variable с образом окружения по умолчанию (Settings → Variables)
          ENV_IMAGE: ${{ inputs.env_image || vars.DEFAULT_ENV_IMAGE }}
          VERSION: ${{ inputs.version || 'latest' }}
        run: |
          test -n "$ENV_IMAGE" || { echo "Не задан env_image и переменная DEFAULT_ENV_IMAGE"; exit 1; }
          HOSTS=local ./build-image.sh "$VERSION" --env "$ENV_IMAGE" --push
