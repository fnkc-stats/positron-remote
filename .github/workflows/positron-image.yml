# Builds the Positron layer on top of an environment image and pushes it to the private package
# ghcr.io/<owner>/positron:<env name>-<env tag>-<version>.
# Uses the same build-image.sh as local builds. If the image is already in the registry, the build is skipped.
#
# Usually optional: run-positron.sh builds a missing image on the host itself. Useful for preparing
# an image for a new Positron version in advance (weekly for DEFAULT_ENV_IMAGE).
name: positron image

on:
  workflow_dispatch:
    inputs:
      env_image:
        description: "Tagged environment image, e.g. ghcr.io/<owner>/r-env:2026.11.16-abc1234 (empty = the DEFAULT_ENV_IMAGE variable)"
        required: false
      version:
        description: "Positron version, e.g. 2026.11.1-4 (empty = latest release)"
        required: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          # Repository variable with the default environment image (Settings -> Variables)
          ENV_IMAGE: ${{ inputs.env_image || vars.DEFAULT_ENV_IMAGE }}
          VERSION: ${{ inputs.version || 'latest' }}
        run: |
          test -n "$ENV_IMAGE" || { echo "Neither env_image nor the DEFAULT_ENV_IMAGE variable is set"; exit 1; }
          REGISTRY="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")"
          export REGISTRY
          HOSTS=local ./build-image.sh "$VERSION" --env "$ENV_IMAGE" --push
