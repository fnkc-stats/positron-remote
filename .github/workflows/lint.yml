# The same checks as the pre-commit hook (./lint.sh), on every push and pull request.
# Catches commits made without the hook or with --no-verify.
name: lint

on:
  workflow_call:
    outputs:
      extension:
        description: Package and validate the extension
        value: ${{ jobs.lint.outputs.extension }}
      pin:
        description: Validate the template pin
        value: ${{ jobs.lint.outputs.pin }}
      environment:
        description: Validate environment images
        value: ${{ jobs.lint.outputs.environment }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      extension: ${{ steps.scope.outputs.extension }}
      pin: ${{ steps.scope.outputs.pin }}
      environment: ${{ steps.scope.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans every commit (lint.sh), so a secret added and removed inside a pull request is found too
          fetch-depth: 0
          persist-credentials: false
      # fnkc-ctl targets Node 22 (Positron's extension host); its tests run TypeScript directly
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      # shellcheck is preinstalled on the runner; actionlint and hadolint run from Docker images (see lint.sh)
      - run: ./lint.sh
      - name: Select checks for this change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MANUAL_TARGET: ${{ github.event.inputs.target }}
        run: bash .github/scripts/ci-scope.sh >> "$GITHUB_OUTPUT"
