# The same checks as the pre-commit hook (./lint.sh), on every push and pull request.
# Catches commits made without the hook or with --no-verify.
name: lint

on:
  # Branches are checked by their pull request (and by the pre-commit hook); main after each merge
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans every commit (lint.sh), so a secret added and removed inside a pull request is found too
          fetch-depth: 0
          persist-credentials: false
      # fnkc-ctl targets Node 22 (Positron's extension host); its tests run TypeScript directly
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      # shellcheck is preinstalled on the runner; actionlint and hadolint run from Docker images (see lint.sh)
      - run: ./lint.sh
