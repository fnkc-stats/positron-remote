name: control validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - run: ./lint.sh
  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - name: Prepare fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt gnupg
          npm ci --prefix ctl
          npm --prefix ctl run build:cli
          image="$(jq -r .image project-template/container.json)"
          docker pull "$image"
          echo "FNKC_TEST_IMAGE=$image" >> "$GITHUB_ENV"
          echo "FNKC_BACKUP_TEST_IMAGE=$image" >> "$GITHUB_ENV"
      - run: python3 ctl/test/ssh-integration.py
      - run: python3 ctl/test/backup-integration.py
      - run: npm --prefix ctl run test:removal -- "$FNKC_TEST_IMAGE"
      - run: ctl/test/clone-integration.sh "$FNKC_TEST_IMAGE"
      - run: ctl/test/environment-integration.sh "$FNKC_TEST_IMAGE"
      - run: ctl/test/e2e.sh "$FNKC_TEST_IMAGE"
