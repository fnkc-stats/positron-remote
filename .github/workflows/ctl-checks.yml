name: control validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - run: ./lint.sh
      # Needs the network, so not in lint.sh. fnkc-ctl has no runtime dependencies; this covers the build tools
      - name: Known vulnerabilities in the build dependencies
        run: npm audit --prefix ctl --audit-level=critical
  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - name: Tools the tests use
        run: sudo apt-get update && sudo apt-get install -y git-crypt gnupg && npm ci --prefix ctl
      # The same script runs locally (./ci-local.sh integration): one list of integration tests for both
      - name: Integration tests on the image the template pins
        run: ctl/test/integration.sh
