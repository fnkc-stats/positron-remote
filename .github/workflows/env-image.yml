# The team image r-env: env/Dockerfile with the packages of env/renv.lock. Built, checked and published by
# image.yml; projects pin the published digest.
name: env image
on:
  push:
    branches: [main]
    paths: ['env/**', '!env/derived/**', 'ctl/**', 'checks/**', '.github/workflows/env-image.yml', '.github/workflows/image.yml']
  pull_request:
    paths: ['env/**', '!env/derived/**', 'ctl/**', 'checks/**', '.github/workflows/env-image.yml', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: env-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - run: npm ci --prefix ctl && ./lint.sh
  image:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      name: r-env
