name: env image
on:
  push:
    branches: [main]
    paths: ['env/**', 'ctl/**', '.github/workflows/env-image.yml']
  pull_request:
    paths: ['env/**', 'ctl/**', '.github/workflows/env-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: env-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - run: npm ci --prefix ctl && ./lint.sh
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: env
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: r-env:verified
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify as analyst and render synthetic report
        run: |
          docker run --rm --network none --user 1000:1000 --entrypoint sh r-env:verified -c \
            'Rscript /usr/local/share/r-env/verify.R && d=$(mktemp -d) && cp /usr/local/share/r-env/smoke.qmd "$d/" && cd "$d" && quarto render smoke.qmd && test -s smoke.html'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test actual SSH and broker behavior
        run: npm ci --prefix ctl && npm --prefix ctl run test:ssh
      - name: Login for trusted main publication only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image (unique tag; pin its digest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/r-env"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag r-env:verified "$image:$tag"
          docker push "$image:$tag"
          digest="$(docker image inspect "$image:$tag" --format '{{index .RepoDigests 0}}')"
          echo "Pin in container.json: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
  publish-manifest:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish native multi-architecture index after both platforms pass
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/r-env"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create -t "$image:$tag" "$image:$tag-amd64" "$image:$tag-arm64"
          digest="$(docker buildx imagetools inspect "$image:$tag" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$digest"
          echo "Multi-architecture container.json image: \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
