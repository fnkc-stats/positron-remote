# The team images r-env, per R series: the R environment (env/Dockerfile with env/versions/<series>/{build.args,
# renv.lock}), which projects pin in container.json, and on top of it the team's Positron server (env/positron.args,
# shared by all series), which project containers run. All are published to the same repository r-env. Built,
# checked and published by image.yml (and positron.yml for the server layer).
# Built once per input: an environment is built and published only when its inputs change (env/inputs.sh: the
# Dockerfile, the files it copies, build.args, renv.lock). Otherwise the published one is pulled and the same checks
# run on it, so changes of fnkc-ctl, the checks or the workflows are tested against what projects pin, and pins do
# not go stale with new digests of the same environment.
#   A new Positron release for the team: env/positron.sh, commit, merge. The environments stay the same; each gets
#   the new server layer; for other Positron versions, positron.yml adds it on request (Build Environment).
#   New R packages: env/lock.sh, commit, merge; projects move to the new environment by its digest.
name: env image
on:
  push:
    branches: [main]
    paths: ['env/**', 'ctl/**', 'checks/**', '.github/workflows/env-image.yml', '.github/workflows/image.yml', '.github/workflows/positron.yml']
  pull_request:
    paths: ['env/**', 'ctl/**', 'checks/**', '.github/workflows/env-image.yml', '.github/workflows/image.yml', '.github/workflows/positron.yml']
  workflow_dispatch:
    inputs:
      series:
        description: 'R series to build (folder under env/versions, e.g. 4.6; empty: all)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  # A waiting run is replaced by a newer one of its group: requests for different series must not replace each other
  group: env-${{ github.ref }}-${{ inputs.series }}
  # Pull requests: a newer push replaces the run. Main publishes images, so its runs always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      series: ${{ steps.list.outputs.series }}
      positron: ${{ steps.list.outputs.positron }}
      r-checks: ${{ steps.scope.outputs.r-checks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # env/published.sh compares the inputs at the commits of published environments
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - run: npm ci --prefix ctl && ./lint.sh
      # The R checks run on an unchanged published environment only when something they test changed: the same
      # image with the same checks gives the same result. fnkc-ctl changes are still tested on it (test:ssh).
      - name: Whether the R checks can give a new result
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          r_checks=true
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(env/|checks/|\.github/workflows/(image|env-image)\.yml$)' || r_checks=false
          fi
          echo "r-checks=$r_checks" >> "$GITHUB_OUTPUT"
          echo "R checks on unchanged environments: $r_checks" >> "$GITHUB_STEP_SUMMARY"
      - name: List R series
        id: list
        env:
          ONLY: ${{ inputs.series }}
          OWNER: ${{ github.repository_owner }}
        run: |
          series='[]'
          for dir in env/versions/*/; do
            s="$(basename "$dir")"
            [ -z "$ONLY" ] || [ "$ONLY" = "$s" ] || continue
            [[ "$s" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "invalid series folder: $dir" >&2; exit 1; }
            [ -f "$dir/build.args" ] && [ -f "$dir/renv.lock" ] || { echo "$dir needs build.args and renv.lock" >&2; exit 1; }
            grep -qx "R_SERIES=$s" "$dir/build.args" || { echo "$dir/build.args: R_SERIES must be $s" >&2; exit 1; }
            tidyverse="$(jq -r '.Packages.tidyverse.Version // ""' "$dir/renv.lock")"
            lock="$(sha256sum "$dir/renv.lock" | cut -d' ' -f1)"
            args="$(cat "$dir/build.args"; echo "TIDYVERSE_VERSION=$tidyverse"; echo "RENV_LOCK_SHA256=$lock")"
            existing="$(env/published.sh "$OWNER" "$s")"
            if [ -n "$existing" ]; then echo "R $s: inputs unchanged, reusing $existing" >> "$GITHUB_STEP_SUMMARY"
            else echo "R $s: new inputs ($(env/inputs.sh "$s")), building" >> "$GITHUB_STEP_SUMMARY"; fi
            series="$(jq -c --arg s "$s" --arg a "$args" --arg e "$existing" '. + [{series: $s, args: $a, existing: $e}]' <<< "$series")"
          done
          [ "$series" != '[]' ] || { echo "no R series to build" >&2; exit 1; }
          echo "series=$series" >> "$GITHUB_OUTPUT"
          { echo 'positron<<EOF'; cat env/positron.args; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          echo "R series: $series"
  image:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.series) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      name: r-env
      variant: ${{ matrix.series }}
      build-args: ${{ matrix.args }}
      positron-args: ${{ needs.validate.outputs.positron }}
      existing: ${{ matrix.existing }}
      r-checks: ${{ matrix.existing == '' || needs.validate.outputs.r-checks == 'true' }}
