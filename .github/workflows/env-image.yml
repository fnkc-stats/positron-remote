# Builds the environment image ghcr.io/<owner>/r-env from env/.
# Tag: <date>-<short commit>, e.g. 2026.11.16-abc1234; plus latest (for convenience only,
# projects pin a specific tag in .devcontainer/devcontainer.json). Existing tags are never overwritten.
name: env image

on:
  push:
    branches: [main]
    paths: ["env/**", ".github/workflows/env-image.yml"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms: linux/amd64 or linux/amd64,linux/arm64 (arm64 runs natively on Apple Silicon, builds take longer)"
        default: linux/amd64

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tag
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/r-env" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: env
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "In a project's .devcontainer/devcontainer.json: \`\"image\": \"${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\"\`" >> "$GITHUB_STEP_SUMMARY"
