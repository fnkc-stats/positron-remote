name: Windows client acceptance
on:
  push:
    branches: [main]
    paths: ['ctl/**', '.github/workflows/windows-client.yml']
  pull_request:
    paths: ['ctl/**', '.github/workflows/windows-client.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows-client:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - run: npm ci --prefix ctl
      - run: npm --prefix ctl run typecheck
      - run: npm --prefix ctl run test:windows
      - run: npm --prefix ctl run build
