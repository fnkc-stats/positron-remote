# The fnkc-ctl client on Windows: typecheck, the Windows tests (ctl/test/windows.acceptance.ts), the build, and the
# PowerShell script the extension runs to set up WSL parses. Called by extension.yml on every change of ctl/, whose
# release waits for it, so a Windows-only failure never reaches a published .vsix; by hand: workflow_dispatch.
name: Windows client acceptance
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-client:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - run: npm ci --prefix ctl
      - name: setup-wsl.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\ctl\windows\setup-wsl.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
      - run: npm --prefix ctl run typecheck
      - run: npm --prefix ctl run test:windows
      - run: npm --prefix ctl run build
