# The R environment checks (checks/README.md): package requirements and the team's common tasks on synthetic
# data, in the image projects pin (project-template/container.json), or in any image given by hand.
# Runs when that pin changes, with fnkc-ctl's checks (ctl-checks.yml): the integration tests run on the pinned
# image and the pin's published Positron image must pass the real provenance verification. Changes to checks/ are tested by env-image.yml (image.yml), on the published environment
# of each series when its inputs did not change, or on the new one. A change of this file: run it by hand
# (workflow_dispatch).
name: Checks · R environment
on:
  push:
    branches: [main]
    paths: ['project-template/container.json']
  workflow_call:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to check, for example ghcr.io/fnkc-stats/r-env@sha256:... (empty: the one in project-template/container.json)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  ctl:
    uses: ./.github/workflows/ctl-checks.yml
  checks:
    # One architecture is enough here: env-image.yml runs these checks natively on amd64 and arm64 for every series
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pull the image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          image="${IMAGE:-$(jq -r .image project-template/container.json)}"
          docker pull --quiet "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Run the checks (no network, as the analyst user)
        run: checks/run.sh --out "$RUNNER_TEMP/r-checks" "$IMAGE"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r-checks
          path: ${{ runner.temp }}/r-checks
          if-no-files-found: ignore
