name: PR checks
on: pull_request
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  scope:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      extension: ${{ steps.paths.outputs.extension }}
      environment: ${{ steps.paths.outputs.environment }}
      r: ${{ steps.paths.outputs.r }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Compare the merge commit to its first parent (the base used for this run).
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        shell: bash
        run: |
          changed() {
            local key="$1" status=0
            shift
            git diff --quiet --no-renames HEAD^1 HEAD -- "$@" || status=$?
            case "$status" in
              0) echo "$key=false" ;;
              1) echo "$key=true" ;;
              *) return "$status" ;;
            esac
          }
          workflows=.github/workflows
          {
            changed extension ctl lint.sh "$workflows/extension.yml" "$workflows/ctl-checks.yml" \
              "$workflows/windows-client.yml" "$workflows/check-setup.yml" .github/scripts/publish-release.sh
            changed environment env ctl checks "$workflows/env-image.yml" "$workflows/image.yml" \
              "$workflows/positron.yml"
            changed r project-template/container.json
          } >> "$GITHUB_OUTPUT"
  extension:
    needs: scope
    if: needs.scope.outputs.extension == 'true'
    # Match the called workflow's job permissions. Publication is gated on main there.
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/extension.yml
  environment:
    needs: scope
    if: needs.scope.outputs.environment == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/env-image.yml
  r:
    needs: scope
    if: needs.scope.outputs.r == 'true'
    uses: ./.github/workflows/r-checks.yml
