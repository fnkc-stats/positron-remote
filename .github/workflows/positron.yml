# Adds the server of one Positron build to a published R environment image (env/positron.Dockerfile): the image
# project containers run. One layer on top of the environment, so it takes minutes, and the R part is the pinned
# image itself. Published as positron-<version>-<environment digest> (a tag fnkc-ctl derives from the pin and its
# Positron, so Open finds it with one request), on main only. Built once: if that tag is published already, the run
# reports it and builds nothing (the server is pinned by its checksum, so a new build would only change the digest) —
# unless that image was made from another recipe (positron.recipe: env/positron.Dockerfile and the server's build
# arguments) or its provenance does not verify: then a new image replaces the tag, so a fix of the recipe ships. Never
# from an older main commit than the one that published it (a rerun of an old run fails instead), and never when the
# attestation service keeps failing (.github/scripts/positron-tag.sh).
# Publication is staged: both architectures by the digests their own jobs pushed, joined under staging-<tag>, that
# index attested and checked as hosts check it, and only then the tag moved to it (one publication per tag at a time).
# positron-promote.yml moves a tag back to an earlier verified image (rollback, docs/operations.md).
#   - called by image.yml after each new environment image, with the team's Positron (env/positron.args);
#   - run by hand, by fnkc-ctl build or the extension's Build Environment, for another Positron version or an older
#     environment (projects keep their pin; a new Positron needs only this).
name: Images · Positron server
run-name: positron image ${{ inputs.positron }}${{ inputs.request && format(' [{0}]', inputs.request) || '' }}
on:
  workflow_call:
    inputs:
      base:
        description: 'The environment image, pinned by digest'
        required: true
        type: string
      positron-args:
        description: 'The Positron server (env/positron.args format), one NAME=value per line'
        required: true
        type: string
      force:
        description: 'Build a fresh image with a new provenance record even when the version tag already exists'
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: 'The published image, pinned by digest'
        value: ${{ jobs.publish-manifest.outputs.image || jobs.args.outputs.existing }}
  workflow_dispatch:
    inputs:
      base:
        description: 'The environment image, as in container.json (ghcr.io/<owner>/r-env@sha256:...)'
        required: true
      positron:
        description: 'Positron version, e.g. 2026.07.1-5'
        required: true
      request:
        description: 'Any id, shown in the run name (set by fnkc-ctl build)'
        required: false
        default: ''
      force:
        description: 'Build a fresh image with a new digest and provenance record, including for existing tags (not needed for a changed recipe or a missing attestation: those rebuild by themselves)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  args:
    runs-on: ubuntu-24.04
    outputs:
      args: ${{ steps.args.outputs.args }}
      tag: ${{ steps.args.outputs.tag }}
      version: ${{ steps.args.outputs.version }}
      r-version: ${{ steps.args.outputs.r-version }}
      recipe: ${{ steps.args.outputs.recipe }}
      existing: ${{ steps.args.outputs.existing }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The environment and the Positron server
        id: args
        env:
          BASE: ${{ inputs.base }}
          GIVEN: ${{ inputs.positron-args }}
          POSITRON: ${{ inputs.positron }}
          OWNER: ${{ github.repository_owner }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/r-env"
          config_labels='if has("config") then .config.Labels else (to_entries | map(select(.key | startswith("linux/"))) | .[0].value.config.Labels) end'
          [[ "$BASE" =~ ^${repo//./\\.}@sha256:[0-9a-f]{64}$ ]] || { echo "base must be $repo@sha256:<digest>, not '$BASE'" >&2; exit 1; }
          # Only an environment: an image that already has a Positron server is not a base
          labels="$(docker buildx imagetools inspect "$BASE" --format '{{json .Image}}' | jq -c "$config_labels")"
          echo "$labels" | jq -e '(."positron.commit" // "") == "" and (."r-env.r-series" // "") != ""' >/dev/null \
            || { echo "$BASE is not an R environment image (env/Dockerfile): labels $labels" >&2; exit 1; }
          if [ -n "$GIVEN" ]; then
            args="$GIVEN"
          elif grep -qx "POSITRON_VERSION=$POSITRON" env/positron.args; then
            args="$(cat env/positron.args)"
          else
            [[ "$POSITRON" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+-[0-9]+$ ]] || { echo "not a Positron version: $POSITRON" >&2; exit 1; }
            args="$(env/positron.sh --print "$POSITRON")"
          fi
          version="$(sed -n 's/^POSITRON_VERSION=//p' <<< "$args")"
          { echo 'args<<EOF'; echo "$args"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          tag="positron-$version-${BASE##*sha256:}"
          # version and r-version: the registry's readable labels and description (not in the recipe: they do not
          # change what runs)
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "r-version=$(jq -r '."r-env.r-version" // ""' <<< "$labels")"
          } >> "$GITHUB_OUTPUT"
          # The recipe: what the image is made from besides the environment (in the tag) and a forced run's id
          recipe="$({ sha256sum < env/positron.Dockerfile; grep -v '^[[:space:]]*$' <<< "$args" | LC_ALL=C sort; } | sha256sum | cut -c1-64)"
          echo "recipe=$recipe" >> "$GITHUB_OUTPUT"
          echo "R ${labels:+$(jq -r '."r-env.r-version"' <<< "$labels")} from $BASE, Positron $version, recipe ${recipe:0:12}" >> "$GITHUB_STEP_SUMMARY"
          [ "$FORCE" != true ] || exit 0
          # A lookup that fails for any reason but a missing tag stops the run: it must not publish a new image by mistake
          if ! out="$(docker buildx imagetools inspect "$repo:$tag" --format '{{json .Manifest}}' 2>&1)"; then
            grep -qiE 'not found|manifest unknown' <<< "$out" || { echo "could not look up $repo:$tag: $out" >&2; exit 1; }
            echo "Not published yet: \`$repo:$tag\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          digest="$(jq -er .digest <<< "$out")"
          have="$(docker buildx imagetools inspect "$repo@$digest" --format '{{json .Image}}' | jq -r "$config_labels | .\"positron.recipe\" // \"\"")"
          why=''
          if [ "$have" != "$recipe" ]; then
            why="it was made from another recipe (${have:-none recorded})"
          else
            # Transient errors of the attestation service are retried; an answer that stays out is no reason to rebuild
            status=0; reason="$(.github/scripts/positron-tag.sh provenance "$repo@$digest")" || status=$?
            case "$status" in
              0) ;;
              1) why="its provenance does not verify ($reason)" ;;
              *) echo "Could not check the provenance of \`$repo@$digest\`: nothing built or published; run again later (force builds a new image regardless)" >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            esac
          fi
          # An older run (or a rerun of one) must not replace what a newer main commit published; checked again at promotion
          if [ -n "$why" ] && ! reason="$(.github/scripts/positron-tag.sh newest "$repo@$digest")"; then
            echo "Not replacing \`$repo:$tag\` (\`$repo@$digest\`): ${reason:-the commits could not be compared}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$why" ]; then
            echo "existing=$repo@$digest" >> "$GITHUB_OUTPUT"
            echo "Already published: \`$repo:$tag\` (\`$repo@$digest\`), nothing to build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Replacing \`$repo:$tag\` (\`$repo@$digest\`): $why" >> "$GITHUB_STEP_SUMMARY"
          fi
  build:
    needs: args
    if: needs.args.outputs.existing == ''
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The job can push packages and attest: no token in .git/config for the build
          persist-credentials: false
      - name: Build on the environment
        env:
          BASE: ${{ inputs.base }}
          ARGS: ${{ needs.args.outputs.args }}
          FORCE: ${{ inputs.force }}
          RECIPE: ${{ needs.args.outputs.recipe }}
          VERSION: ${{ needs.args.outputs.version }}
          R_VERSION: ${{ needs.args.outputs.r-version }}
        run: |
          args=(--build-arg "BASE=$BASE" --build-arg "RECIPE=$RECIPE")
          # The environment's OCI labels would otherwise name the R version as this image's version
          args+=(--label "org.opencontainers.image.title=r-env positron"
            --label "org.opencontainers.image.version=$VERSION"
            --label "org.opencontainers.image.description=Positron $VERSION server on the R $R_VERSION environment for FNKC projects"
            --label "org.opencontainers.image.revision=$GITHUB_SHA")
          if [ "$FORCE" = true ]; then args+=(--build-arg "PROVENANCE_RUN=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"); fi
          while IFS= read -r line; do [ -n "$line" ] && args+=(--build-arg "$line"); done <<< "$ARGS"
          docker build "${args[@]}" -f env/positron.Dockerfile -t r-env:positron env
      - name: The Positron server runs as analyst, without network; its Quarto is the pinned one; the image names its environment
        env:
          BASE: ${{ inputs.base }}
          RECIPE: ${{ needs.args.outputs.recipe }}
        run: |
          commit="$(docker image inspect r-env:positron --format '{{index .Config.Labels "positron.commit"}}')"
          test -n "$commit"
          test "$(docker image inspect r-env:positron --format '{{index .Config.Labels "r-env.base"}}')" = "$BASE"
          test "$(docker image inspect r-env:positron --format '{{index .Config.Labels "positron.recipe"}}')" = "$RECIPE"
          docker run --rm --network none --user 1000:1000 --entrypoint sh r-env:positron -c \
            "/home/analyst/.positron-server/bin/$commit/bin/positron-server --version | grep -qx 'Positron SHA: $commit'"
          quarto="$(docker image inspect r-env:positron --format '{{index .Config.Labels "r-env.quarto-version"}}')"
          test -n "$quarto"
          docker run --rm --network none --user 1000:1000 --entrypoint sh r-env:positron -c \
            "test -L /home/analyst/.positron-server/bin/$commit/quarto && test \"\$(/home/analyst/.positron-server/bin/$commit/quarto/bin/quarto --version)\" = '$quarto'"
      - name: Login for trusted main publication only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The digest this job pushed, passed on by artifact: the architecture tag is shared with other runs for the
      # same tag (forced builds), so the index must not be made from what the tag points to later
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.args.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/r-env"
          docker tag r-env:positron "$image:$TAG-$ARCH"
          out="$(docker push "$image:$TAG-$ARCH")"
          echo "$out"
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' <<< "$out" | tail -n 1)"
          test -n "$digest"
          # With Docker's containerd image store the push is an index (image and its attestation): take the image
          raw="$(docker buildx imagetools inspect "$image@$digest" --raw)"
          if jq -e 'has("manifests")' <<< "$raw" >/dev/null; then
            digest="$(jq -er --arg a "$ARCH" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a)][0].digest' <<< "$raw")"
          fi
          mkdir -p "$RUNNER_TEMP/digest"
          echo "$image@$digest" > "$RUNNER_TEMP/digest/$ARCH"
      - name: Pass on the pushed digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: positron-digest-${{ needs.args.outputs.tag }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error
  publish-manifest:
    needs: [args, build]
    if: needs.args.outputs.existing == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One publication per tag at a time (also positron-promote.yml): what is attested and verified is what is promoted
    concurrency:
      group: positron-publish-${{ needs.args.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.promote.outputs.image }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Named by tag: env-image.yml publishes the three series in one run
          pattern: positron-digest-${{ needs.args.outputs.tag }}-*
          path: ${{ runner.temp }}/digest
          merge-multiple: true
      - name: Join this run's two images under the staging tag
        id: index
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.args.outputs.tag }}
          VERSION: ${{ needs.args.outputs.version }}
          R_VERSION: ${{ needs.args.outputs.r-version }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/r-env"
          amd64="$(cat "$RUNNER_TEMP/digest/amd64")"
          arm64="$(cat "$RUNNER_TEMP/digest/arm64")"
          for ref in "$amd64" "$arm64"; do [[ "$ref" =~ ^${image//./\\.}@sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest '$ref'" >&2; exit 1; }; done
          # Not a positron-* tag, so fnkc-ctl never runs it; one per tag, reused by its next publication
          # The registry shows a multi-architecture image's description from the index annotation
          docker buildx imagetools create -t "$image:staging-$TAG" \
            --annotation "index:org.opencontainers.image.description=Positron $VERSION server on the R $R_VERSION environment for FNKC projects" \
            "$amd64" "$arm64"
          digest="$(docker buildx imagetools inspect "$image:staging-$TAG" --format '{{json .Manifest}}' | jq -er .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          # The index holds exactly the images this run built and checked
          docker buildx imagetools inspect "$image@$digest" --raw \
            | jq -e --arg a "${amd64#*@}" --arg b "${arm64#*@}" '[.manifests[] | select(.platform.os == "linux") | .digest] | sort == ([$a, $b] | sort)' >/dev/null
          {
            echo "name=$image"
            echo "digest=$digest"
            echo "image=$image@$digest"
          } >> "$GITHUB_OUTPUT"
          echo "Staged \`$image:staging-$TAG\` (\`$image@$digest\`)" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the staged image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.name }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          github-token: ${{ github.token }}
      # What hosts do before starting it: fnkc-ctl's client fetches the proof, its host check verifies it with gh in a
      # container without network or credentials. A published image that hosts would refuse fails its run here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - name: Hosts can verify the attestation offline
        env:
          IMAGE: ${{ steps.index.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix ctl --ignore-scripts
          npm --prefix ctl run test:provenance -- "$IMAGE" "$GITHUB_REPOSITORY"
      # Only now does Open find it: the tag moves to the verified index, by digest
      - name: Promote the verified image to the tag
        id: promote
        env:
          NAME: ${{ steps.index.outputs.name }}
          DIGEST: ${{ steps.index.outputs.digest }}
          TAG: ${{ needs.args.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Under the publication lock: the tag must not move to an older recipe than the one it has (a run from an
          # older main commit that started, or was rerun, after a newer one). A failed lookup stops: it is no answer.
          before=''
          if out="$(docker buildx imagetools inspect "$NAME:$TAG" --format '{{json .Manifest}}' 2>&1)"; then
            before="$(jq -er .digest <<< "$out")"
            if ! reason="$(.github/scripts/positron-tag.sh newest "$NAME@$before")"; then
              echo "Not promoted: ${reason:-the commits could not be compared}; \`$NAME:$TAG\` stays at \`$before\`" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            grep -qiE 'not found|manifest unknown' <<< "$out" || { echo "could not look up $NAME:$TAG: $out" >&2; exit 1; }
          fi
          docker buildx imagetools create -t "$NAME:$TAG" "$NAME@$DIGEST"
          now="$(docker buildx imagetools inspect "$NAME:$TAG" --format '{{json .Manifest}}' | jq -er .digest)"
          [ "$now" = "$DIGEST" ] || { echo "$NAME:$TAG points to $now after promotion, not $DIGEST" >&2; exit 1; }
          echo "image=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published \`$NAME:$TAG\` (\`$NAME@$DIGEST\`)${before:+, replacing \`$before\` (rollback: positron-promote.yml with that digest)}" >> "$GITHUB_STEP_SUMMARY"
