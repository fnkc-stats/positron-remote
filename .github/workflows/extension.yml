# The extension and the server bundle as a GitHub release, after every change of fnkc-ctl on main: tag
# fnkc-projects-v<version>, with fnkc-projects.vsix, fnkc-ctl-server.tar.gz and a .sha256 file for each. The version
# is <major.minor of ctl/package.json>.<run number>, so every release is newer than the one before; the installed
# extension finds it by itself (FNKC Projects: Check for Updates, client/update.ts). The repository is public, so
# https://github.com/<owner>/<repo>/releases/latest/download/fnkc-projects.vsix needs no login.
# Pull requests only build the files and check that the packaged extension activates. The release waits for the
# Linux control validation, native Windows acceptance and Check Setup on Ubuntu, macOS and Windows.
name: extension
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Checks to run
        type: choice
        default: extension
        options: [extension, windows, check-setup]
permissions:
  contents: read
concurrency:
  group: extension-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # A newer push to a pull request replaces its run; releases from main always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  validate:
    needs: lint
    if: needs.lint.outputs.extension == 'true' || needs.lint.outputs.pin == 'true'
    uses: ./.github/workflows/ctl-checks.yml
    with:
      lint-passed: true
  env-image:
    needs: lint
    if: needs.lint.outputs.environment == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/env-image.yml
  pin:
    needs: lint
    if: needs.lint.outputs.pin == 'true'
    uses: ./.github/workflows/r-checks.yml
  windows:
    needs: lint
    if: needs.lint.outputs.extension == 'true' || inputs.target == 'windows'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - run: npm ci --prefix ctl
      - name: setup-wsl.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\ctl\windows\setup-wsl.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
      - run: npm --prefix ctl run typecheck
      - run: npm --prefix ctl run test:windows
      - run: npm --prefix ctl run build
  check-setup:
    needs: lint
    if: needs.lint.outputs.extension == 'true' || inputs.target == 'check-setup'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FNKC_SYSTEM_TESTS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - run: npm ci --prefix ctl
      # sshd for a local stand-in of Gitea; gnupg for the passphrase-window fix; apt lists for the package check
      - name: Tools the Linux test uses
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server gnupg
      # The Linux test runs fnkc-ctl doctor --json as an account outside the docker group
      - run: npm --prefix ctl run build:cli
      - run: npm --prefix ctl run test:check-setup
  release:
    needs: [validate, windows, check-setup]
    concurrency:
      group: extension-release-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The release notes list the fnkc-ctl commits since the previous release
          fetch-depth: 0
          # No token in .git/config for the build tools (the job can write releases); the public repository fetches without one
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ctl/package-lock.json
      - name: Version
        id: version
        run: |
          base="$(jq -r .version ctl/package.json | cut -d. -f1,2)"
          version="$base.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          (cd ctl && npm version --no-git-tag-version --allow-same-version "$version" >/dev/null)
      - name: Package
        run: |
          npm ci --prefix ctl --ignore-scripts
          npm --prefix ctl run package
          npm --prefix ctl run server-bundle
          # What this release needs from servers: clients are offered it once every server has it (upgrades go server first)
          node ctl/dist/fnkc-ctl.cjs --version --json > ctl/dist/fnkc-projects-compat.json
          cd ctl/dist
          for f in fnkc-projects.vsix fnkc-ctl-server.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256
      # The file about to be published, installed in a clean VS Code of the oldest version engines.vscode accepts:
      # it must activate, register its commands and run Show Log (ctl/test/vsix-smoke.ts; unit tests use a fake vscode)
      - name: Activate the packaged extension
        timeout-minutes: 10
        run: xvfb-run -a npm --prefix ctl run test:vsix -- dist/fnkc-projects.vsix
      # Provenance of the release files: gh attestation verify <file> --repo <owner>/<repo> (docs/admin-setup.md)
      - name: Attest the release files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ctl/dist/fnkc-projects.vsix
            ctl/dist/fnkc-ctl-server.tar.gz
          github-token: ${{ github.token }}
      - name: Publish the release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # The logic is a script so it is tested locally (ctl/test/release.test.ts)
        run: .github/scripts/publish-release.sh
