# Copy into a project repository as .github/workflows/env.yml (only if the project has its own Dockerfile).
# Builds ghcr.io/<owner>/<project>-env:<date>-<commit> when the Dockerfile changes.
name: env

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  workflow_dispatch:

jobs:
  env:
    uses: fnkc-stats/positron-remote/.github/workflows/project-env.yml@main
    permissions:
      contents: read
      packages: write
