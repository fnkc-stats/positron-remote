# Копируется в репозиторий проекта как .github/workflows/env.yml (только если у проекта свой Dockerfile).
# Собирает ghcr.io/<owner>/<проект>-env:<дата>-<commit> при изменении Dockerfile.
name: env

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  workflow_dispatch:

jobs:
  env:
    uses: OWNER/positron-remote/.github/workflows/project-env.yml@main
    permissions:
      contents: read
      packages: write
